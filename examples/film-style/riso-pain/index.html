<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Du pain chaud</title>
<link rel="stylesheet" href="/core/fonts/fonts.css">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="print"></canvas>
<script type="module">
// Demo of the Risograph recipe (modules/opuscar/styles/risograph/STYLE.md): a fictional bakery, written for this kit.
// One canvas holds the plates: R = blue, G = yellow, B = pink. A shader prints them on paper. Every frame depends only on t.
import { clamp, lerp, seg, ss, eio, eo, back, mulberry } from '/core/lib.js';
import { TIMELINE as T, EVENTS } from './timeline.js';

const W = innerWidth, H = innerHeight, S = H / 1080;
const plate = document.createElement('canvas'); plate.width = W; plate.height = H;
const g = plate.getContext('2d', { willReadFrequently: false });
const ink = (b, y, p) => `rgb(${Math.round(b * 255)},${Math.round(y * 255)},${Math.round(p * 255)})`;
const PAPER = ink(0, 0, 0);

// ---------- the printer ----------
const out = document.getElementById('print'); out.width = W; out.height = H;
const gl = out.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
const VS = `#version 300 es
in vec2 a; out vec2 v; void main(){ v = a * .5 + .5; gl_Position = vec4(a, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D P; uniform vec2 R; uniform float boil, sheet, per;
uniform vec2 off[3]; uniform float rot[3]; uniform float gate[3];
float hash(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
float dens(int k, vec2 px){
  vec2 c = R * .5, d = px - c; float s = sin(rot[k]), co = cos(rot[k]);
  vec2 q = vec2(co * d.x - s * d.y, s * d.x + co * d.y) + c + off[k];
  return texture(P, q / R)[k];
}
float cover(int k, vec2 px, float ang){
  float d = dens(k, px);
  float edge = gate[k] * R.x;
  float front = smoothstep(edge + 3., edge - 3., px.x);
  float band = exp(-pow((px.x - edge) / (R.x * .012), 2.)) * step(.001, gate[k]) * step(gate[k], .999);
  float ca = cos(ang), sa = sin(ang);
  vec2 g2 = vec2(ca * px.x + sa * px.y, -sa * px.x + ca * px.y) * 6.28318 / per;
  float spot = .5 + .25 * (cos(g2.x) + cos(g2.y));
  float grain = hash(px + vec2(float(k) * 17., boil * 3.)) - .5;
  float cov = d >= .9 ? 1. : smoothstep(spot - .16, spot + .16, d + grain * .05);
  cov *= step(.004, d);
  cov *= 1. - .05 * vnoise(vec2(px.x * .012 + sheet + float(k) * 9., sheet));
  cov *= 1. - .07 * vnoise(px * .006 + sheet * 3.1 + float(k));
  cov *= 1. - step(.9975, hash(floor(px / 1.5) + float(k) * 3. + sheet)) * .85;
  return clamp((cov + band * d * .18) * front, 0., 1.);
}
void main(){
  vec2 px = vec2(v.x, 1. - v.y) * R;
  vec3 paper = vec3(.957, .933, .886) * (1. - .018 * vnoise(px * vec2(.9, .07)) - .012 * vnoise(px * .35));
  vec3 inkB = vec3(.0, .471, .749), inkY = vec3(1., .91, .0), inkP = vec3(1., .282, .69);
  vec3 c = paper;
  c *= mix(vec3(1.), inkB, cover(0, px, .2618));
  c *= mix(vec3(1.), inkY, cover(1, px, 1.3090));
  c *= mix(vec3(1.), inkP, cover(2, px, .7854));
  o = vec4(c, 1.);
}`;
const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.bindAttribLocation(prog, 0, 'a'); gl.vertexAttribPointer(gl.getAttribLocation(prog, 'a'), 2, gl.FLOAT, false, 0, 0); gl.enableVertexAttribArray(gl.getAttribLocation(prog, 'a'));
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
const U = n => gl.getUniformLocation(prog, n);
gl.uniform2f(U('R'), W, H); gl.uniform1f(U('per'), Math.max(4, 7 * S));
function press(t, shot) {
  // Fixed offsets per shot; a kick when a plate lands. Never a jitter per frame.
  const reg = mulberry(shot * 37 + 5); const base = [0, 1, 2].map(() => [(reg() - .5) * 5 * S, (reg() - .5) * 5 * S]);
  const kick = at => { const u = t - at; return u < 0 || u > .32 ? 0 : 12 * S * Math.exp(-u * 13) * Math.cos(u * 34); };
  const k = kick(T.yellow) + kick(T.pink) * 1.2 + kick(T.loaf) * .7 + kick(T.title) * .8;
  gl.uniform2fv(U('off'), [base[0][0], base[0][1], base[1][0] + k, base[1][1] - k * .4, base[2][0] - k * .7, base[2][1] + k * .3]);
  gl.uniform1fv(U('rot'), [0, .0007, -.0006]);
  gl.uniform1fv(U('gate'), [1, eio(seg(t, T.yellow - .3, T.yellow + .25)), eio(seg(t, T.pink - .3, T.pink + .25))]);
  gl.uniform1f(U('boil'), Math.floor(t * 12) % 3); gl.uniform1f(U('sheet'), shot * 2.7);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, plate);
  gl.viewport(0, 0, W, H); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- drawing on the plates ----------
const rect = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
const disc = (c, x, y, r) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill(); };
const poly = (c, pts) => { g.fillStyle = c; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill(); };
const line = (c, w, pts) => { g.strokeStyle = c; g.lineWidth = w; g.lineCap = g.lineJoin = 'round'; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); };
const HOR = H * .71;
const SUN = { x: .71 * W, y: H * .3, r: 112 * S };
const SHOP_X = 2650 * S;

function hills(cam) {
  const c = ink(.42, 1, 0), f = cam * .32, pts = [[-20, HOR]];
  for (let x = -20; x <= W + 60; x += 30 * S) { const wx = x + f; pts.push([x, HOR - 118 * S - 66 * S * Math.sin(wx / (310 * S)) - 34 * S * Math.sin(wx / (121 * S) + 1.3)]); }
  pts.push([W + 60, HOR]); poly(c, pts);
}
function houses(cam, t) {
  const r = mulberry(11);
  for (let i = 0; i < 16; i++) {
    const w = (150 + r() * 120) * S, h = (120 + r() * 120) * S, wx = i * 300 * S + r() * 80 * S, x = wx - cam;
    const windows = r() > .25, chimney = r() > .55;
    if (x > W + 60 || x + w < -60 || wx + w > SHOP_X - 60 * S) continue;
    poly(ink(1, 0, .42), [[x - 12 * S, HOR - h], [x + w / 2, HOR - h - 78 * S], [x + w + 12 * S, HOR - h]]);
    rect(ink(.52, 0, 0), x, HOR - h, w, h);   // a tint: the solid blue of the rider must read in front of it
    if (chimney) rect(ink(1, 0, 0), x + w * .7, HOR - h - 68 * S, 26 * S, 62 * S);
    if (windows) for (let k = 0; k < 2; k++) rect(ink(0, 1, 0), x + w * (.2 + k * .38), HOR - h * .72, w * .2, h * .3);
  }
}
function shop(cam) {
  const x = SHOP_X - cam * 1, w = 520 * S, h = 330 * S;
  if (x > W + 60 || x + w < -60) return;
  rect(ink(0, 1, .26), x, HOR - h, w, h);
  poly(ink(1, 0, 0), [[x - 26 * S, HOR - h], [x + w * .5, HOR - h - 120 * S], [x + w + 26 * S, HOR - h]]);
  rect(ink(1, 0, 0), x + w - 92 * S, HOR - h - 118 * S, 34 * S, 100 * S);
  for (let i = 0; i < 8; i++) rect(i % 2 ? PAPER : ink(0, 0, 1), x + i * w / 8, HOR - h * .66, w / 8, 56 * S);
  rect(ink(1, 0, 0), x + w * .68, HOR - h * .47, 104 * S, h * .47);
  rect(PAPER, x + w * .08, HOR - h * .47, w * .52, h * .34);
  for (let i = 0; i < 4; i++) disc(ink(0, 1, .62), x + w * (.15 + i * .125), HOR - h * .24, 25 * S);
  g.fillStyle = ink(1, 0, 0); g.font = `${46 * S}px "Lilita One"`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('BOULANGERIE', x + w / 2, HOR - h * .85);
}
function cyclist(x, tt, rolling) {
  // Acts on twos: the pedals turn at 12 drawings per second, the camera stays smooth.
  const a = Math.floor(tt * 12) / 12 * 6.2832 * 1.5 * rolling, y = HOR + 40 * S, R0 = 38 * S;
  const draw = (body, tire, scarf, bread, extra) => {
    const hub = [[x - 66 * S, y], [x + 66 * S, y]], seat = [x - 16 * S, y - 78 * S], bars = [x + 44 * S, y - 86 * S], crank = [x, y - 4 * S];
    for (const h of hub) { g.strokeStyle = tire; g.lineWidth = 7 * S + extra; g.beginPath(); g.arc(h[0], h[1], R0, 0, 6.2832); g.stroke(); }
    line(body, 6 * S + extra, [hub[0], seat, crank, hub[0]]); line(body, 6 * S + extra, [seat, bars, hub[1]]); line(body, 6 * S + extra, [crank, bars]);
    const foot = [crank[0] + Math.cos(a) * 20 * S, crank[1] + Math.sin(a) * 20 * S], knee = [seat[0] + (foot[0] - seat[0]) * .5 + 24 * S, seat[1] + (foot[1] - seat[1]) * .45];
    line(body, 13 * S + extra, [[seat[0], seat[1] - 8 * S], knee, foot]);
    const neck = [x + 6 * S, y - 152 * S];
    line(body, 22 * S + extra, [[seat[0], seat[1] - 8 * S], neck]); line(body, 10 * S + extra, [neck, [x + 26 * S, y - 106 * S], bars]);
    disc(body, x + 16 * S, y - 186 * S, 24 * S + extra / 2);
    const wave = Math.sin(tt * 9) * 12 * S;
    line(scarf, 8 * S + extra, [[neck[0] - 2 * S, neck[1] + 2 * S], [neck[0] - 34 * S, neck[1] + wave * .5], [neck[0] - 68 * S, neck[1] + wave]]);
    rect(bread === PAPER ? PAPER : ink(1, 0, 0), x + 44 * S - extra / 2, y - 84 * S - extra / 2, 54 * S + extra, 26 * S + extra);
    line(bread, 15 * S + extra, [[x + 52 * S, y - 88 * S], [x + 90 * S, y - 122 * S]]); line(bread, 15 * S + extra, [[x + 68 * S, y - 86 * S], [x + 102 * S, y - 112 * S]]);
  };
  draw(PAPER, PAPER, PAPER, PAPER, 10 * S);   // the paper-white halo traps the figure against the plates
  draw(ink(1, 0, 0), ink(1, 0, 0), ink(0, 0, 1), ink(0, 1, .62), 0);
}
function village(t) {
  const u = Math.min(t, T.arrive), cam = lerp(0, SHOP_X - W * .34, eio(seg(u, 0, T.arrive)) * .6 + seg(u, 0, T.arrive) * .4);
  rect(ink(.1, 0, 0), 0, H * .13, W, H * .14);                        // stepped sky, blue plate only
  rect(ink(.2, 0, 0), 0, 0, W, H * .13);
  disc(PAPER, SUN.x, SUN.y, SUN.r * 1.06);                            // a knockout: blank until its plate arrives
  disc(ink(0, 1, 0), SUN.x, SUN.y, SUN.r);
  hills(cam); houses(cam, t);
  rect(ink(.62, 1, 0), 0, HOR, W, H - HOR);
  rect(ink(.2, 0, 0), 0, HOR + 72 * S, W, 92 * S);
  shop(cam);
  const screen = lerp(-180 * S, SHOP_X - cam + 590 * S, ss(seg(t, 0, T.arrive)));   // stops beside the shop: head against the sky, window in view
  cyclist(screen, t, t < T.arrive ? 1 : 0);
}
function loaf(t) {
  const u = seg(t, T.loaf, T.loaf + .9), x = lerp(SUN.x, W * .27, eio(u)), y = lerp(SUN.y, H * .5, eio(u)), r = lerp(SUN.r, 330 * S, eio(u));
  rect(ink(0, 1, 0), 0, 0, W, H);
  disc(PAPER, x, y, r * 1.03);
  disc(ink(0, 1, .55), x, y, r);
  g.save(); g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.clip();
  rect(ink(.34, 1, .55), x - r, y + r * .42, r * 2, r);               // a stepped shadow: tint of the first plate
  g.restore();
  for (let i = 0; i < 3; i++) {
    const a = -.55 + i * .55; line(ink(1, 1, .55), r * .055, [[x + r * (Math.sin(a) * .62 - .22), y - r * (Math.cos(a) * .62)], [x + r * (Math.sin(a) * .62 + .22), y - r * (Math.cos(a) * .2)]]);
  }
  // Steam on twos, a travelling wave of bare paper: the held title keeps breathing
  const two = Math.floor(t * 12) / 12;
  for (let i = 0; i < 3; i++) {
    const sx = x + (i - 1) * r * .42, pts = [], rise = seg(t, T.loaf + .5, T.loaf + 1.1);
    for (let k = 0; k <= 12; k++) { const v = k / 12; pts.push([sx + Math.sin(v * 6 - two * 5 + i * 1.7) * 20 * S * v, y - r * 1.04 - v * 118 * S * rise]); }
    line(PAPER, 12 * S, pts);
  }
  const k = eo(seg(t, T.title, T.title + .35));
  g.save(); g.beginPath(); g.rect(0, 0, W * .46 + W * .56 * k, H); g.clip();
  g.textAlign = 'left'; g.textBaseline = 'middle'; g.font = `${136 * S}px "Lilita One"`;
  const lines = [['Du pain chaud', H * .42], ['chaque matin.', H * .58]];
  g.globalCompositeOperation = 'lighter';
  for (const [txt, ty] of lines) { g.fillStyle = ink(0, 0, 1); g.fillText(txt, W * .5 + 7 * S, ty + 6 * S); g.fillStyle = ink(1, 0, 0); g.fillText(txt, W * .5, ty); }
  g.globalCompositeOperation = 'source-over'; g.restore();
}

window.DUR = T.end;
window.EV = EVENTS;
window.TEXTS = t => {
  if (t < T.title) return [];
  g.font = `${136 * S}px "Lilita One"`;
  return [['a', 'Du pain chaud', .42], ['b', 'chaque matin.', .58]].map(([id, text, y]) => ({ id, text, x0: W * .5, y0: H * y - 70 * S, x1: W * .5 + g.measureText(text).width, y1: H * y + 70 * S }));
};
window.render = t => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; rect(PAPER, 0, 0, W, H);
  const second = t >= T.loaf;
  if (second) loaf(t); else village(t);
  press(t, second ? 2 : 1);
};
document.fonts.load(`136px "Lilita One"`, 'Du pain chaud').then(() => { window.READY = true; });
</script></body></html>
