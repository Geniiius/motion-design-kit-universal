<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Paper UI — transformación</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet" />
<script src="../engine/core.js"></script>
<style>
  /* ===== Campos personalizables ===== */
  :root {
    --canvas: #ECEAE4;   /* gris cálido "papel" */
    --ink: #111111;      /* UI negra */
    --paper: #FFFFFF;    /* superficie de la tarjeta */
    --accent: #E8462C;   /* UN solo color de acento */
    --muted: #8A877F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: var(--canvas); }
  body { font-family: "Geist", system-ui, sans-serif; color: var(--ink); position: relative; }
  .hud { position: absolute; font: 500 17px "Geist Mono", monospace; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  #shape { position: absolute; left: 50%; top: 50%; overflow: hidden; display: grid; place-items: center; will-change: transform; }
  #label { position: absolute; font-weight: 600; font-size: 38px; color: #fff; letter-spacing: -.01em; white-space: nowrap; }
  #spinner, #check { position: absolute; }
  #card { position: absolute; inset: 0; padding: 52px 56px; display: flex; flex-direction: column; }
  #card .top { display: flex; justify-content: space-between; align-items: flex-start; }
  #card .kicker { font: 500 18px "Geist Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  #card .title { font-size: 44px; font-weight: 600; letter-spacing: -.03em; margin-top: 10px; }
  #card .num { font-size: 64px; font-weight: 700; letter-spacing: -.04em; color: var(--accent); }
  #bars { margin-top: auto; height: 250px; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 2px solid #E4E2DC; position: relative; }
  .bar { width: 64px; background: var(--ink); border-radius: 10px 10px 4px 4px; }
  .bar:nth-child(7) { background: var(--accent); }
  #tip { position: absolute; padding: 10px 16px; background: var(--ink); color: #fff; border-radius: 12px; font: 500 20px "Geist Mono", monospace; white-space: nowrap; }
  #cursor { position: absolute; left: 0; top: 0; width: 46px; height: 46px; transform-origin: 6px 4px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.18)); }
</style>
</head>
<body>
  <div class="hud" style="left:48px; top:44px">Motion Kit — 01 / UI morph</div>
  <div class="hud" style="right:48px; top:44px">120 BPM</div>
  <div class="hud" style="left:48px; bottom:44px">1080 × 1080</div>
  <div class="hud" id="tc" style="right:48px; bottom:44px">00:00:00</div>

  <div id="shape">
    <div id="label">Generar</div>
    <svg id="spinner" width="64" height="64" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="6" />
      <circle id="arc" cx="32" cy="32" r="24" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="105" />
    </svg>
    <svg id="check" width="70" height="70" viewBox="0 0 70 70">
      <path id="tick" d="M18 36 L30 48 L53 23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" />
    </svg>
    <div id="card">
      <div class="top">
        <div><div class="kicker">Informe · Octubre</div><div class="title">Ventas generadas</div></div>
        <div class="num" id="num">+0%</div>
      </div>
      <div id="bars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div id="tip">OCT · 1 284</div>
      </div>
    </div>
  </div>

  <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2 L3 19 L7.6 14.8 L10.6 21.4 L13.6 20.1 L10.7 13.6 L17 13.4 Z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>

<script>
const { track, prog, ease, spring, bezier, keyframes, lerp, css, $, timecode } = PM;
window.COMP = { width: 1080, height: 1080, fps: 30, duration: 8, bpm: 120 };

// Momentos clave (en segundos, sobre la rejilla de 120 BPM = 0,5 s por tiempo)
const CLICK = 1.5, LOADER = 1.6, CHECK = 3.0, CARD = 3.5, CLOSE_CLICK = 6.9, CLOSE = 7.0;
const BARS = [0.36, 0.52, 0.44, 0.66, 0.58, 0.8, 0.96];
const ink = [17, 17, 17], accent = [232, 70, 44], paper = [255, 255, 255];

// Trayectoria del cursor: tramos de Bézier [inicio, fin, desde, ctrl1, ctrl2, hasta]
const OFF = [1190, 1170];
const PATH = [
  [0.15, 1.35, OFF, [1000, 900], [700, 720], [585, 565]],
  [1.8, 2.6, [585, 565], [640, 640], [700, 700], [760, 735]],
  [4.5, 5.2, [760, 735], [820, 720], [840, 650], [832, 600]],
  [6.2, 6.85, [832, 600], [760, 560], [620, 560], [560, 560]],
  [7.15, 7.95, [560, 560], [700, 700], [1000, 960], OFF],
];
function cursorAt(t) {
  let pos = OFF;
  for (const [a, b, p0, c1, c2, p1] of PATH) {
    if (t >= a) pos = t >= b ? p1 : bezier(ease.inOutCubic(prog(t, a, b)), p0, c1, c2, p1);
  }
  return pos;
}
const mix = (t, keys) => [0, 1, 2].map((i) => Math.round(track(t, keys[0][1][i], keys.slice(1).map(([at, c]) => [at, c[i]]), { stiffness: 600, damping: 50, mass: 1 })));

const bars = [...document.querySelectorAll(".bar")];

window.seek = (t) => {
  // ---- Forma única: tamaño, radio y color controlados por springs ----
  const w = track(t, 340, [[LOADER, 132], [CARD, 780], [CLOSE, 340]], "snappy");
  const h = track(t, 112, [[LOADER, 132], [CARD, 560], [CLOSE, 112]], "snappy");
  const r = track(t, 56, [[LOADER, 66], [CARD, 40], [CLOSE, 56]], "snappy");
  const squish = track(t, 1, [[CLICK, 0.93], [CLICK + 0.12, 1], [CLOSE_CLICK, 0.97], [CLOSE_CLICK + 0.12, 1]], "pop");
  const bg = mix(t, [[0, ink], [CHECK, accent], [CARD, paper], [CLOSE, ink]]);
  const shadow = prog(t, CARD, CARD + 0.4) * (1 - prog(t, CLOSE, CLOSE + 0.3));
  css("#shape", {
    width: `${w}px`, height: `${h}px`, borderRadius: `${r}px`,
    background: `rgb(${bg})`,
    transform: `translate(-50%, -50%) scale(${squish})`,
    boxShadow: `0 ${30 * shadow}px ${80 * shadow}px rgba(30,25,15,${0.14 * shadow})`,
  });

  // ---- Contenidos: cambio con un desenfoque corto ----
  const label = (1 - prog(t, CLICK + 0.05, CLICK + 0.2)) + prog(t, CLOSE + 0.1, CLOSE + 0.3);
  css("#label", { opacity: label, filter: `blur(${(1 - label) * 8}px)` });

  const spin = prog(t, LOADER + 0.05, LOADER + 0.25) * (1 - prog(t, CHECK - 0.08, CHECK + 0.05));
  css("#spinner", { opacity: spin, transform: `rotate(${t * 520}deg) scale(${0.7 + 0.3 * spin})` });
  $("#arc").setAttribute("stroke-dashoffset", 150.8 - 40 - 30 * Math.sin(t * 6));

  const chk = prog(t, CHECK, CHECK + 0.1) * (1 - prog(t, CARD - 0.05, CARD + 0.05));
  css("#check", { opacity: chk, transform: `scale(${0.6 + 0.4 * spring(t - CHECK, "pop")})` });
  $("#tick").setAttribute("stroke-dashoffset", 1 - ease.outExpo(prog(t, CHECK + 0.05, CHECK + 0.4)));

  const cardIn = prog(t, CARD + 0.15, CARD + 0.4) * (1 - prog(t, CLOSE - 0.12, CLOSE));
  css("#card", { opacity: cardIn, filter: `blur(${(1 - cardIn) * 6}px)` });
  $("#num").textContent = `+${Math.round(48 * ease.outExpo(prog(t, CARD + 0.3, CARD + 1.3)))}%`;
  bars.forEach((b, i) => {
    const g = spring(t - (CARD + 0.3 + i * 0.08), "smooth");
    css(b, { height: `${BARS[i] * 250 * g}px` });
  });

  // ---- Hover: tooltip encima de la última barra ----
  const tip = spring(t - 5.15, "pop") * (1 - prog(t, 6.15, 6.3));
  const hover = 1 + 0.06 * tip;
  css(bars[6], { transform: `scaleX(${hover})` });
  css("#tip", { right: "-20px", bottom: `${BARS[6] * 250 + 24}px`, opacity: tip, transform: `translateY(${(1 - tip) * 12}px) scale(${0.9 + 0.1 * tip})` });

  // ---- Cursor ----
  const [cx, cy] = cursorAt(t);
  const press = track(t, 1, [[CLICK - 0.06, 0.8], [CLICK + 0.1, 1], [CLOSE_CLICK - 0.06, 0.8], [CLOSE_CLICK + 0.1, 1]], "pop");
  css("#cursor", { transform: `translate(${cx}px, ${cy}px) scale(${press})` });

  $("#tc").textContent = timecode(t, COMP.fps);
};
</script>
</body>
</html>
